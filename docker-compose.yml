services:
  smu-worker-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: smu-worker-api:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${WORKER_PORT:-8081}:${WORKER_PORT:-8081}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${FILE_BASE_PATH}:/problems
    environment:
      - FILE_BASE_PATH=/problems
    group_add:
      - "999"
